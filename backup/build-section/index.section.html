<!-- ═══════════════ THE SIGNATURE ═══════════════
     A website assembles itself as you scroll. This is the one
     thing on the page that proves capability rather than
     claiming it — the product, as an animation. -->
<section class="build paper" id="build">
  <div class="build-pin">
    <div class="wrap build-inner">
      <div class="build-copy">
        <p class="eyebrow" data-i18n="build.eyebrow">איך אתר נבנה</p>
        <h2 class="sec-title" data-i18n="build.title">מקופסה ריקה לאתר חי.</h2>
        <p class="sec-lede" data-i18n="build.lede">
          גלול, ותראה בדיוק מה קורה לעסק שלך.
        </p>
        <ul class="build-steps">
          <li class="build-step on" data-i18n="build.s1">מבנה — מה יופיע ואיפה</li>
          <li class="build-step" data-i18n="build.s2">תוכן — מה האתר אומר</li>
          <li class="build-step" data-i18n="build.s3">עיצוב — איך זה מרגיש</li>
          <li class="build-step" data-i18n="build.s4">אתר חי, על הדומיין שלך</li>
        </ul>
      </div>

      <div class="build-stage">
        <div class="browser">
          <div class="browser-bar">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="browser-url">your-business.co.il</span>
          </div>
          <div class="build-body">
            <div class="wf-stack">
              <div class="wf wf-nav"></div>
              <div class="wf wf-hero">
                <div class="wf-line w1"></div>
                <div class="wf-line w2"></div>
                <div class="wf-accent"></div>
              </div>
              <div class="wf-row">
                <div class="wf"></div><div class="wf"></div><div class="wf"></div>
              </div>
            </div>
            <!-- src + caption come from the database. Hardcoding them
                 is why this section kept advertising a site Natan had
                 already deleted. -->
            <img class="build-real" alt="" loading="lazy" />
            <!-- Scroll cue: the screen starts empty, and not everyone
                 knows the animation is scroll-driven. This tells them.
                 The timeline fades it out the moment scrolling begins. -->
            <div class="build-cue" aria-hidden="true">
              <span data-i18n="build.cue">גללו כדי לחשוף</span>
              <svg class="build-cue-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>
        </div>
        <p class="build-cap"></p>
      </div>
    </div>
  </div>
</section>
